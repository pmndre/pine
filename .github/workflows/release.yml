name: Release

# Every push to main publishes pine to npm. The version follows from the commits since the last
# release (see scripts/release.mjs): "feat:" raises the minor number, a breaking change the major
# one (the minor one below 1.0.0), anything else the patch number. A commit message that contains
# [skip release] publishes nothing.
#
# Every push to next publishes a preview of that release ("0.4.0-next.3") under npm's tag "next",
# marked as a pre-release on GitHub. "npm install -g @pmndre/pine" keeps getting the last release.
#
# A release from main also gets the Pine app (desktop/), for both kinds of Mac, attached to its
# GitHub release as disk images: signed with a Developer ID, notarised by Apple and checked the
# way another Mac checks it before it is uploaded. It is not started here: whether a packed app
# runs is tried on a developer's Mac (node desktop/scripts/smoke.mjs), not on every release. That
# needs five secrets, in an environment named "release" that is restricted to the branch main, so
# that no other branch can use them:
#   CSC_LINK            the "Developer ID Application" certificate with its key, a .p12 file, as base64
#   CSC_KEY_PASSWORD    the password of that file
#   APPLE_API_KEY       an App Store Connect API key: the text of its .p8 file
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    the issuer ID shown above the keys
# Without them the app is not built, and the job says so: an app that is not signed and notarised
# is one macOS refuses to open, so none is handed out.
#
# A release from main also gets the Pine app for Linux (an AppImage and a deb for x64 and arm64,
# with SHA256SUMS and GitHub's build attestation; no secrets) and for Windows (an installer for
# x64 and arm64, signed through SignPath Foundation: four secrets in the environment "signing-trial",
# listed above the job app-windows;
# desktop/signpath/README.md says how it is set up; without them the installers go out unsigned).
#
# After those, the package managers are told of the release, each with one more secret in the
# environment "release"; without it the job submits nothing and says so:
#   WINGET_TOKEN         a classic personal access token of abernier's, scope public_repo, for the
#                        pull request to microsoft/winget-pkgs (job winget, from abernier's fork)
#   AUR_SSH_PRIVATE_KEY  the private SSH key of the AUR account that maintains pine-desktop-bin (job aur)
#
# A release from main also gets the Android app (mobile/), attached as Pine-<version>.apk, with
# versionName the release's version and versionCode major*1000000 + minor*1000 + patch
# (mobile/scripts/version-code.ts). It is signed with pine's release key, which takes four more
# secrets in the same environment "release":
#   ANDROID_KEYSTORE           the keystore with the key (a .jks or PKCS12 file), as base64
#   ANDROID_KEYSTORE_PASSWORD  the password of that file
#   ANDROID_KEY_ALIAS          the alias of the key in it
#   ANDROID_KEY_PASSWORD       the password of the key (for PKCS12, the same as the file's)
# Without any of them no APK is built, and the job says so; with only some of them it fails. Keep
# that key: Android installs an update only over an app signed with the same key. The keystore
# (pine-release.p12, alias "pine", one password for the file and the key) is kept by the owner, with
# a copy in a private Drive folder: https://drive.google.com/drive/folders/1q7zBdpHUBbL4LfyK0PcnNuiLbFdGm7K0
# Its certificate's SHA-256: 7E:B3:9B:29:D0:39:58:42:E7:E5:76:C4:A0:40:93:1B:89:AB:EC:CA:D6:0E:4D:2C:90:8B:5F:D1:71:40:A5:EC
#
# The iOS app (mobile/) is not built here for now: its core's tests do not pass on GitHub's Xcode 27
# preview image. Its IPA is made by hand on a Mac (pnpm run ipa in mobile/).
#
# The apps of a release (the disk images and the APK) can be built again by hand, without publishing
# anything: Actions > Release > Run workflow, from main, with the release's version (gh workflow run
# release.yml -f version=0.38.0). They are built from that release's tag and attached to that
# release, but only what the release does not have yet: a file that is there already is kept as it
# is, and the log says so. Its bytes are what Homebrew, winget, Scoop and the AUR pin by their hash,
# so a repair that replaced it would break them. "apps" builds only the apps it names, a comma list
# without spaces of mac, linux, windows and android (-f apps=android for the APK alone; empty is
# all). "replace" (-f replace=true) replaces the files that are there, for when that is meant.
#
# The Windows app's signing can be tried from any branch without a release: Run workflow with
# "signing_trial" checked (gh workflow run release.yml --ref <branch> -f version=0.0.1 -f
# signing_trial=true). Only the two Windows jobs run, from that branch, with the secrets of the
# environment "signing-trial" (SignPath's test signing policy, or the one "signing_policy" names:
# -f signing_policy=release-signing tries the real certificate), and the signed installers are an
# artifact of the run, attached to nothing.
#
# Publishing uses npm's trusted publishing: on npmjs.com, the package's settings name this
# repository and this workflow file as a trusted publisher, and no token is stored anywhere.
# A repository secret NPM_TOKEN, if there is one, is used instead.

on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      version:
        description: Build the Pine app again for this release and attach it (a version that has a release, like 0.38.0)
        required: true
      signing_trial:
        description: Only try the Windows app's signing, from this branch, with SignPath's test certificate (the version is a label then; nothing is attached to a release)
        type: boolean
        default: false
      apps:
        description: Build only these apps, a comma list without spaces of mac, linux, windows, android (empty is all of them)
        default: ''
      replace:
        description: Replace the files the release has already (without it, only what is missing is attached)
        type: boolean
        default: false
      signing_policy:
        description: The SignPath signing policy of the Windows app (empty is test-signing for a trial, release-signing otherwise)
        default: ''

permissions:
  contents: read

# Whether an upload replaces a file the release has already. A push makes a new release, which has
# none yet, and uploads as it always did; a run by hand replaces nothing unless "replace" says so.
env:
  CLOBBER: ${{ github.event_name == 'push' || inputs.replace }}

jobs:
  # A run by hand names its apps: a name that is not one of them would build nothing and say nothing.
  check-apps:
    if: github.event_name == 'workflow_dispatch' && inputs.apps != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          APPS: ${{ inputs.apps }}
        run: |
          # The jobs look for ",<app>," in ",$APPS,": a space would hide the name from them.
          case "$APPS" in
            *[[:space:]]*) echo "::error::\"$APPS\": separate the apps by commas without spaces (mac,android)."; exit 1 ;;
          esac
          for app in $(printf '%s' "$APPS" | tr ',' ' '); do
            case "$app" in
              mac|linux|windows|android) ;;
              *) echo "::error::\"$app\" is not an app of a release: name mac, linux, windows or android, separated by commas without spaces."; exit 1 ;;
            esac
          done
          echo "Building: $APPS"

  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time for a branch: the version is worked out from what npm has. A preview does not
    # wait for a release, and nothing waits for the app of a release to be built and notarised.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # the release and its tag
      id-token: write # trusted publishing
    outputs:
      version: ${{ steps.publish.outputs.version }}
      channel: ${{ steps.publish.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the commits since the last release decide the version
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @pmndre/pine
      - run: pnpm run check
      - run: pnpm test
      - id: publish
        run: node scripts/release.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}

  # The Pine app of a release, once for each kind of Mac, on a runner of that kind: the app is
  # started there before it is uploaded.
  app:
    needs: release
    # After a release from main, or by hand for a release there already is (the release job is then skipped).
    if: always() && !inputs.signing_trial && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest') && (!inputs.apps || contains(format(',{0},', inputs.apps), ',mac,'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write # the disk image, the zip and the feed go to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_TEXT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing ${name%_TEXT}"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 5 ]; then
            echo "::notice::The Pine app was not built: the environment \"release\" has no signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app cannot be signed and notarised: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$APPLE_API_KEY_TEXT" > "$RUNNER_TEMP/app-store-connect.p8"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit. The history goes along, for what the package says each version changed.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # also the Node the app carries
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        name: Use the newest Xcode on the runner
        # pine's helpers are built here, and the voice helper uses the speech recognition of macOS 26
        # where a Mac has it: that takes the macOS 26 SDK, which the runner's default Xcode is too old for.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          sdk="$(DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The newest Xcode on this runner has the macOS $sdk SDK; pine's helpers need 26 or newer."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
      - if: steps.signing.outputs.ready == 'true'
        name: Pack, sign and notarise
        run: node desktop/scripts/pack.mjs --dmg --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: steps.signing.outputs.ready == 'true'
        name: What another Mac will say to it
        run: |
          app="desktop/release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Pine.app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - if: steps.signing.outputs.ready == 'true'
        # The disk image, and what the apps in the field update from: the app zipped after its ticket was
        # attached, and the feed that points at that zip on this release's tag (desktop/scripts/update-feed.ts).
        run: |
          files=("desktop/release/Pine-$VERSION-${{ matrix.arch }}.dmg" "desktop/release/Pine-$VERSION-${{ matrix.arch }}.zip" "desktop/release/Pine-${{ matrix.arch }}.json")
          if [ "$CLOBBER" = true ]; then
            gh release upload "v$VERSION" --clobber "${files[@]}"
          else
            # By hand: only what the release does not have yet. What it has is what was published, and
            # what Homebrew, winget, Scoop and the AUR pinned by its hash.
            have="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            kept=""
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if printf '%s\n' "$have" | grep -Fxq "$name"; then
                echo "::notice::Kept as it was: $name is on v$VERSION already (replace=true replaces it)."
                kept="$kept $name"
              else
                gh release upload "v$VERSION" "$file"
              fi
            done
            echo "Kept as they were:${kept:- nothing}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"

  # The Pine app of a release for Linux: an AppImage and a deb for each kind of processor, started
  # on a virtual screen before they are uploaded. Nothing is signed: what a download is, the
  # release's SHA256SUMS and GitHub's attestation of where it was built say.
  app-linux:
    needs: release
    if: always() && !inputs.signing_trial && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest') && (!inputs.apps || contains(format(',{0},', inputs.apps), ',linux,'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # the packages go to the release
      id-token: write # the attestation
      attestations: write
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What node-pty is built with, and a screen for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
      - name: Pack
        run: node desktop/scripts/pack.mjs --dist --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
      - name: Start it once
        run: xvfb-run -a node desktop/scripts/smoke.mjs
      # Before the checksums and the attestation, which then cover the AppImage as it goes out and its .zsync.
      - name: The AppImage's update information and AppStream data
        run: sh desktop/scripts/appimage-update.sh desktop/release/Pine-"$VERSION"-*.AppImage
      - name: Checksums
        run: |
          cd desktop/release
          sha256sum Pine-"$VERSION"-*.AppImage Pine-"$VERSION"-*.AppImage.zsync *.deb > SHA256SUMS-linux-${{ matrix.arch }}
          cat SHA256SUMS-linux-${{ matrix.arch }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/release/Pine-*
      - run: |
          files=(desktop/release/Pine-"$VERSION"-*.AppImage desktop/release/Pine-"$VERSION"-*.AppImage.zsync desktop/release/*.deb "desktop/release/SHA256SUMS-linux-${{ matrix.arch }}")
          if [ "$CLOBBER" = true ]; then
            gh release upload "v$VERSION" --clobber "${files[@]}"
          else
            # By hand: only what the release does not have yet. What it has is what was published, and
            # what Homebrew, winget, Scoop and the AUR pinned by its hash.
            have="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            kept=""
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if printf '%s\n' "$have" | grep -Fxq "$name"; then
                echo "::notice::Kept as it was: $name is on v$VERSION already (replace=true replaces it)."
                kept="$kept $name"
              else
                gh release upload "v$VERSION" "$file"
              fi
            done
            echo "Kept as they were:${kept:- nothing}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # The AUR package pine-desktop-bin (packaging/aur/pine-desktop-bin/PKGBUILD), moved to the release:
  # its version, and the checksums of the two debs app-linux uploaded. The PKGBUILD in the repository
  # stays as it is; the AUR's copy is the one that follows the releases.
  aur:
    needs: [release, app-linux]
    # Only when this run built the Linux app: a run by hand that names other apps leaves the AUR alone.
    if: always() && !inputs.signing_trial && needs.app-linux.result == 'success' && (!inputs.apps || contains(format(',{0},', inputs.apps), ',linux,'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
      PKGBUILD: packaging/aur/pine-desktop-bin/PKGBUILD
    steps:
      - id: secret
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "::notice::Nothing was submitted to the AUR: the environment \"release\" has no AUR_SSH_PRIVATE_KEY yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - if: steps.secret.outputs.ready == 'true'
        name: The PKGBUILD, moved to the release
        run: |
          if [ ! -f "$PKGBUILD" ]; then
            echo "::error::$PKGBUILD is not in this checkout: the AUR package cannot be updated without it."
            exit 1
          fi
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-linux-*' --dir "$RUNNER_TEMP/sums"
          x64="$(awk -v f="Pine-$VERSION-amd64.deb" '$2 == f || $2 == "*" f { print $1 }' "$RUNNER_TEMP/sums/SHA256SUMS-linux-x64")"
          arm64="$(awk -v f="Pine-$VERSION-arm64.deb" '$2 == f || $2 == "*" f { print $1 }' "$RUNNER_TEMP/sums/SHA256SUMS-linux-arm64")"
          for sum in "$x64" "$arm64"; do
            if ! printf '%s' "$sum" | grep -Eq '^[0-9a-f]{64}$'; then
              echo "::error::The release v$VERSION has no checksum of both debs in its SHA256SUMS-linux-x64 and SHA256SUMS-linux-arm64."
              exit 1
            fi
          done
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('$x64')/" \
            -e "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('$arm64')/" \
            "$PKGBUILD"
          for line in "pkgver=$VERSION" "pkgrel=1" "sha256sums_x86_64=('$x64')" "sha256sums_aarch64=('$arm64')"; do
            if ! grep -qxF "$line" "$PKGBUILD"; then
              echo "::error::$PKGBUILD has no line $line after the update: its form changed, and this step has to follow."
              exit 1
            fi
          done
          git diff -- "$PKGBUILD"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.secret.outputs.ready == 'true'
        uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: pine-desktop-bin
          pkgbuild: ${{ env.PKGBUILD }}
          commit_username: pine release
          commit_email: noreply@github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update to ${{ env.VERSION }}
          updpkgsums: false

  # The Pine app of a release for Windows: an installer for each kind of processor, signed with
  # SignPath Foundation's certificate for open-source projects. Two jobs: app-windows packs the app's
  # folder on each processor and starts it once; app-windows-sign has both folders signed in one
  # request, makes the two installers from the signed folders, and has those signed in a second one.
  # So a release asks the owner for two approvals at signpath.io, not four.
  # It needs four secrets in the environment "signing-trial", for a release as for a trial:
  #   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
  # They live there and nowhere else because that is the only copy there is: they were set once
  # from SignPath's pages, and nobody here can read them back to set them again in "release". The
  # token is the CI user's, the same for both policies, so only the policy differs: a release asks
  # for "release-signing" by name (SIGNING_POLICY below), a trial for the secret's (test-signing)
  # unless "signing_policy" names another. The Windows jobs take nothing else from an environment.
  # "signing-trial" has to allow the branches that a release and a trial run from.
  # The project at signpath.io needs the two artifact configurations in desktop/signpath/
  # (slugs "app-folder" and "installer"). desktop/signpath/README.md says how it is set up.
  # Without the secrets the installers are uploaded unsigned, and the job says so: Windows warns
  # about them ("More info", then "Run anyway" installs one) until the release they are signed in.
  app-windows:
    needs: release
    # A signing trial is the Windows jobs alone, whatever "apps" says.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest') && (inputs.signing_trial || !inputs.apps || contains(format(',{0},', inputs.apps), ',windows,'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    environment: signing-trial
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
      SECRETS_IN: signing-trial
      TRIAL: ${{ inputs.signing_trial && 'true' || 'false' }}
      # Empty: the policy of the secret SIGNPATH_POLICY_SLUG (test-signing).
      SIGNING_POLICY: ${{ inputs.signing_policy || (!inputs.signing_trial && 'release-signing' || '') }}
    defaults:
      run:
        shell: bash
    steps:
      - id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          missing=""
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          # Without the secrets a release's installers go out unsigned (Windows warns, "Run anyway"
          # installs them), and from the first release with them on, signed. A trial is only signing.
          if [ "$(echo $missing | wc -w)" -eq 4 ] && [ "$TRIAL" != "true" ]; then
            echo "::notice::The Pine app for Windows is not signed: the environment \"$SECRETS_IN\" has no SignPath secrets yet (desktop/signpath/README.md). Its installers are uploaded unsigned."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app for Windows cannot be signed: these secrets are missing in the environment \"$SECRETS_IN\":$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: git config --global core.autocrlf false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ !inputs.signing_trial && inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
      - if: steps.signing.outputs.ready == 'true'
        name: Pack the app's folder
        run: node desktop/scripts/pack.mjs --dir --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
      - if: steps.signing.outputs.ready == 'true'
        name: Start it once
        run: node desktop/scripts/smoke.mjs
      # Under a name without a wildcard: a wildcard in the path would keep the folder's own name
      # (win-unpacked, win-arm64-unpacked) inside the artifact, and SignPath's configuration
      # expects Pine.exe at the top of each processor's folder.
      - if: steps.signing.outputs.ready == 'true'
        run: mv desktop/release/win-*unpacked desktop/release/app
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-${{ matrix.arch }}
          path: desktop/release/app/
          retention-days: 3

  app-windows-sign:
    needs: [release, app-windows]
    if: always() && needs.app-windows.result == 'success'
    runs-on: windows-latest
    # Each request waits for the owner's approval at signpath.io (an e-mail says one is waiting).
    timeout-minutes: 300
    environment: signing-trial
    permissions:
      contents: write # the installers go to the release
      actions: read # SignPath reads the artifacts it signs
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
      SECRETS_IN: signing-trial
      TRIAL: ${{ inputs.signing_trial && 'true' || 'false' }}
      # Empty: the policy of the secret SIGNPATH_POLICY_SLUG (test-signing).
      SIGNING_POLICY: ${{ inputs.signing_policy || (!inputs.signing_trial && 'release-signing' || '') }}
    defaults:
      run:
        shell: bash
    steps:
      - id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          missing=""
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          # Without the secrets a release's installers go out unsigned (Windows warns, "Run anyway"
          # installs them), and from the first release with them on, signed. A trial is only signing.
          if [ "$(echo $missing | wc -w)" -eq 4 ] && [ "$TRIAL" != "true" ]; then
            echo "::notice::The Pine app for Windows is not signed: the environment \"$SECRETS_IN\" has no SignPath secrets yet (desktop/signpath/README.md). Its installers are uploaded unsigned."
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "sign=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app for Windows cannot be signed: these secrets are missing in the environment \"$SECRETS_IN\":$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "sign=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: git config --global core.autocrlf false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ !inputs.signing_trial && inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pine-windows-x64
          path: desktop/release/unsigned/x64
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pine-windows-arm64
          path: desktop/release/unsigned/arm64
      - if: steps.signing.outputs.sign == 'true'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-unsigned
          path: desktop/release/unsigned/
          retention-days: 3
      - if: steps.signing.outputs.sign == 'true'
        name: Sign both folders (waits for the approval at signpath.io)
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY || secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: desktop/release/signed
      - if: steps.signing.outputs.ready == 'true'
        name: The installers, from the signed folders (unsigned ones without the secrets)
        run: |
          node desktop/scripts/pack.mjs --prepackaged desktop/release/$FOLDERS/x64 --arch x64
          node desktop/scripts/pack.mjs --prepackaged desktop/release/$FOLDERS/arm64 --arch arm64
          mkdir -p desktop/release/installers
          mv "desktop/release/Pine-$VERSION-x64-setup.exe" "desktop/release/Pine-$VERSION-arm64-setup.exe" desktop/release/installers/
        env:
          PINE_VERSION: ${{ env.VERSION }}
          FOLDERS: ${{ steps.signing.outputs.sign == 'true' && 'signed' || 'unsigned' }}
      - if: steps.signing.outputs.sign == 'true'
        id: installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-installers
          path: desktop/release/installers/
          retention-days: 3
      - if: steps.signing.outputs.sign == 'true'
        name: Sign both installers (waits for the approval at signpath.io)
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNING_POLICY || secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: desktop/release/out
      - if: steps.signing.outputs.sign == 'true'
        name: What another Windows will say to it
        shell: pwsh
        run: |
          $files = @(
            "desktop\release\out\Pine-$env:VERSION-x64-setup.exe",
            "desktop\release\out\Pine-$env:VERSION-arm64-setup.exe",
            "desktop\release\signed\x64\Pine.exe",
            "desktop\release\signed\arm64\Pine.exe"
          ) + (Get-ChildItem -Recurse -Path desktop\release\signed -Filter "pine-*.exe" | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            # SignPath's test certificate is its own: Windows trusts no signature of it, so with the
            # test policy only that every file was signed is checked.
            if (-not $env:SIGNING_POLICY) { if (-not $s.SignerCertificate) { exit 1 } }
            elseif ($s.Status -ne "Valid") { exit 1 }
          }
      - if: steps.signing.outputs.ready == 'true' && env.TRIAL == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-trial
          path: desktop/release/out/
          retention-days: 3
      - if: steps.signing.outputs.ready == 'true' && env.TRIAL != 'true'
        id: upload
        run: |
          files=("desktop/release/$FROM/Pine-$VERSION-x64-setup.exe" "desktop/release/$FROM/Pine-$VERSION-arm64-setup.exe")
          if [ "$CLOBBER" = true ]; then
            gh release upload "v$VERSION" --clobber "${files[@]}"
          else
            # By hand: only what the release does not have yet. What it has is what was published, and
            # what Homebrew, winget, Scoop and the AUR pinned by its hash.
            have="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            kept=""
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if printf '%s\n' "$have" | grep -Fxq "$name"; then
                echo "::notice::Kept as it was: $name is on v$VERSION already (replace=true replaces it)."
                kept="$kept $name"
              else
                gh release upload "v$VERSION" "$file"
              fi
            done
            echo "Kept as they were:${kept:- nothing}"
            echo "kept=$kept" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          FROM: ${{ steps.signing.outputs.sign == 'true' && 'out' || 'installers' }}
      # Only once the release's installers are the ones signed here: not when a run by hand kept
      # the ones it had, which may not be.
      - if: steps.signing.outputs.sign == 'true' && env.TRIAL != 'true' && steps.upload.outputs.kept == ''
        name: The release's notes say that the app is signed
        # SignPath Foundation, which signs the Windows app, asks that every download page links the code signing policy.
        run: |
          sentence="The Pine app for Windows is signed: [code signing policy](https://github.com/pmndre/pine#code-signing-policy)."
          gh release view "v$VERSION" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          if grep -Fq "$sentence" "$RUNNER_TEMP/notes.md"; then
            echo "The notes of v$VERSION say so already."
          else
            printf '\n%s\n' "$sentence" >> "$RUNNER_TEMP/notes.md"
            gh release edit "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # The WinGet package pmndre.Pine: a pull request to microsoft/winget-pkgs with the release's two
  # installers, made by komac from the version already there. It works only once a first version of
  # pmndre.Pine is in winget-pkgs. The pull request comes from abernier's fork of winget-pkgs.
  winget:
    needs: [release, app-windows-sign]
    # Only when this run built the Windows app: a run by hand that names other apps leaves WinGet alone.
    if: always() && !inputs.signing_trial && needs.app-windows-sign.result == 'success' && (!inputs.apps || contains(format(',{0},', inputs.apps), ',windows,'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: secret
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::Nothing was submitted to WinGet: the environment \"release\" has no WINGET_TOKEN yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secret.outputs.ready == 'true'
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: pmndre.Pine
          version: ${{ env.VERSION }}
          release-tag: v${{ env.VERSION }}
          installers-regex: 'Pine-.*-(x64|arm64)-setup\.exe$'
          fork-user: abernier
          token: ${{ secrets.WINGET_TOKEN }}

  # The Android app of a release (mobile/): a signed APK attached to the release, next to the disk images.
  android:
    needs: release
    # As the app job: after a release from main, or by hand for a release there already is.
    if: always() && !inputs.signing_trial && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest') && (!inputs.apps || contains(format(',{0},', inputs.apps), ',android,'))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the APK goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The Android app was not built: the environment \"release\" has no Android signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Android app cannot be signed: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor's Android code is built for Java 21
      - if: steps.signing.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop --filter pine-mobile
      - if: steps.signing.outputs.ready == 'true'
        name: Check and test the mobile package
        # The bridge, the configuration and both builds of the page: an APK is built only from what passes.
        run: pnpm --filter pine-mobile run check && pnpm --filter pine-mobile test
      - if: steps.signing.outputs.ready == 'true'
        name: The NDK that strips the APK's native libraries
        # The exact one mobile/android/variables.gradle names: without it AGP packages a native
        # library with its debug symbols and only warns. libwebrtc comes stripped, but a library
        # added later may not; the check after the build ("What a phone will say to it") fails then.
        run: |
          ndk="$(sed -n "s/^ *ndkVersion = '\(.*\)'/\1/p" mobile/android/variables.gradle)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - if: steps.signing.outputs.ready == 'true'
        name: Build the page and a signed release APK
        # On the runner's Android SDK (ANDROID_HOME) and the JDK above. The Gradle build signs with the
        # key the environment names, and is given the release's version and its code.
        run: |
          PINE_VERSION_CODE="$(node mobile/scripts/version-code.ts "$VERSION")"
          export PINE_VERSION_CODE
          pnpm --filter pine-mobile run apk:release
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Pine-$VERSION.apk"
        env:
          PINE_VERSION: ${{ env.VERSION }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: steps.signing.outputs.ready == 'true'
        name: What a phone will say to it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "Pine-$VERSION.apk"
          # The native libraries went in stripped (a missing strip tool is only a warning of AGP's).
          unzip -q -o "Pine-$VERSION.apk" 'lib/*' -d "$RUNNER_TEMP/apk-lib"
          for so in "$RUNNER_TEMP"/apk-lib/lib/*/*.so; do
            if "$NDK_DIR"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -S "$so" | grep -q '\.debug_info'; then
              echo "::error::$so carries its debug symbols: the NDK's strip tool was not found."
              exit 1
            fi
          done
      - if: steps.signing.outputs.ready == 'true'
        name: What the APK asks of a phone
        # The permissions of what was built, not of the manifest: a library added later can bring one
        # of its own in when the manifests are merged. Exactly the network and its state, and the
        # signature permission androidx.core declares under the package's name for its own receivers
        # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION), which only this app holds and no owner grants.
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          app=dev.pmndre.pine
          printf '%s\n' \
            "permission: $app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" \
            "uses-permission: name='$app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" \
            "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" \
            "uses-permission: name='android.permission.INTERNET'" | LC_ALL=C sort > "$RUNNER_TEMP/permissions-wanted"
          "$aapt2" dump permissions "Pine-$VERSION.apk" | grep -v '^package: ' | LC_ALL=C sort > "$RUNNER_TEMP/permissions-asked"
          if ! diff -u "$RUNNER_TEMP/permissions-wanted" "$RUNNER_TEMP/permissions-asked"; then
            echo "::error::The APK asks for other permissions than INTERNET and ACCESS_NETWORK_STATE (the lines with + above): find what brought them in (the merged manifest, app/build/intermediates/merged_manifests) and remove them, or change this check knowingly."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: |
          files=("Pine-$VERSION.apk")
          if [ "$CLOBBER" = true ]; then
            gh release upload "v$VERSION" --clobber "${files[@]}"
          else
            # By hand: only what the release does not have yet. What it has is what was published, and
            # what Homebrew, winget, Scoop and the AUR pinned by its hash.
            have="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
            kept=""
            for file in "${files[@]}"; do
              name="$(basename "$file")"
              if printf '%s\n' "$have" | grep -Fxq "$name"; then
                echo "::notice::Kept as it was: $name is on v$VERSION already (replace=true replaces it)."
                kept="$kept $name"
              else
                gh release upload "v$VERSION" "$file"
              fi
            done
            echo "Kept as they were:${kept:- nothing}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
