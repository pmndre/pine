name: Release

# Every push to main publishes pine to npm. The version follows from the commits since the last
# release (see scripts/release.mjs): "feat:" raises the minor number, a breaking change the major
# one (the minor one below 1.0.0), anything else the patch number. A commit message that contains
# [skip release] publishes nothing.
#
# Every push to next publishes a preview of that release ("0.4.0-next.3") under npm's tag "next",
# marked as a pre-release on GitHub. "npm install -g @pmndre/pine" keeps getting the last release.
#
# A release from main also gets the Pine app (desktop/), for both kinds of Mac, attached to its
# GitHub release as disk images: signed with a Developer ID, notarised by Apple and checked the
# way another Mac checks it before it is uploaded. It is not started here: whether a packed app
# runs is tried on a developer's Mac (node desktop/scripts/smoke.mjs), not on every release. That
# needs five secrets, in an environment named "release" that is restricted to the branch main, so
# that no other branch can use them:
#   CSC_LINK            the "Developer ID Application" certificate with its key, a .p12 file, as base64
#   CSC_KEY_PASSWORD    the password of that file
#   APPLE_API_KEY       an App Store Connect API key: the text of its .p8 file
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    the issuer ID shown above the keys
# Without them the app is not built, and the job says so: an app that is not signed and notarised
# is one macOS refuses to open, so none is handed out.
#
# A release from main also gets the Pine app for Linux (an AppImage and a deb for x64 and arm64,
# with SHA256SUMS and GitHub's build attestation; no secrets) and for Windows (an installer for
# x64 and arm64, signed through SignPath Foundation: four secrets, listed above the job app-windows;
# desktop/signpath/README.md says how it is set up).
#
# A release from main also gets the Android app (mobile/), attached as Pine-<version>.apk, with
# versionName the release's version and versionCode major*1000000 + minor*1000 + patch
# (mobile/scripts/version-code.ts). It is signed with pine's release key, which takes four more
# secrets in the same environment "release":
#   ANDROID_KEYSTORE           the keystore with the key (a .jks or PKCS12 file), as base64
#   ANDROID_KEYSTORE_PASSWORD  the password of that file
#   ANDROID_KEY_ALIAS          the alias of the key in it
#   ANDROID_KEY_PASSWORD       the password of the key (for PKCS12, the same as the file's)
# Without any of them no APK is built, and the job says so; with only some of them it fails. Keep
# that key: Android installs an update only over an app signed with the same key.
#
# A release from main also gets the iOS app (mobile/), attached as Pine-<version>.ipa: not signed,
# since whoever installs it signs it with their own Apple ID (AltStore, Sideloadly). It takes no
# secret. Its version is the release's and its build number Android's versionCode
# (mobile/scripts/ipa.ts, which fails unless the app inside is unsigned and arm64).
#
# The apps of a release (the disk images, the APK and the IPA) can be built again by hand, without publishing
# anything: Actions > Release > Run workflow, from main, with the release's version (gh workflow run
# release.yml -f version=0.38.0). They are built from that release's tag and attached to that
# release, in place of what is there.
#
# Publishing uses npm's trusted publishing: on npmjs.com, the package's settings name this
# repository and this workflow file as a trusted publisher, and no token is stored anywhere.
# A repository secret NPM_TOKEN, if there is one, is used instead.

on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      version:
        description: Build the Pine app again for this release and attach it (a version that has a release, like 0.38.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time for a branch: the version is worked out from what npm has. A preview does not
    # wait for a release, and nothing waits for the app of a release to be built and notarised.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # the release and its tag
      id-token: write # trusted publishing
    outputs:
      version: ${{ steps.publish.outputs.version }}
      channel: ${{ steps.publish.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the commits since the last release decide the version
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: npm test
      - id: publish
        run: node scripts/release.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}

  # The Pine app of a release, once for each kind of Mac, on a runner of that kind: the app is
  # started there before it is uploaded.
  app:
    needs: release
    # After a release from main, or by hand for a release there already is (the release job is then skipped).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write # the disk image goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_TEXT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing ${name%_TEXT}"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 5 ]; then
            echo "::notice::The Pine app was not built: the environment \"release\" has no signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app cannot be signed and notarised: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$APPLE_API_KEY_TEXT" > "$RUNNER_TEMP/app-store-connect.p8"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit. The history goes along, for what the package says each version changed.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # also the Node the app carries
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        name: Use the newest Xcode on the runner
        # pine's helpers are built here, and the voice helper uses the speech recognition of macOS 26
        # where a Mac has it: that takes the macOS 26 SDK, which the runner's default Xcode is too old for.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          sdk="$(DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The newest Xcode on this runner has the macOS $sdk SDK; pine's helpers need 26 or newer."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop
      - if: steps.signing.outputs.ready == 'true'
        name: Pack, sign and notarise
        run: node desktop/scripts/pack.mjs --dmg --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: steps.signing.outputs.ready == 'true'
        name: What another Mac will say to it
        run: |
          app="desktop/release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Pine.app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - if: steps.signing.outputs.ready == 'true'
        run: gh release upload "v$VERSION" "desktop/release/Pine-$VERSION-${{ matrix.arch }}.dmg" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"

  # The Pine app of a release for Linux: an AppImage and a deb for each kind of processor, started
  # on a virtual screen before they are uploaded. Nothing is signed: what a download is, the
  # release's SHA256SUMS and GitHub's attestation of where it was built say.
  app-linux:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # the packages go to the release
      id-token: write # the attestation
      attestations: write
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What node-pty is built with, and a screen for the smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci && npm ci --prefix desktop
      - name: Pack
        run: node desktop/scripts/pack.mjs --dist --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
      - name: Start it once
        run: xvfb-run -a node desktop/scripts/smoke.mjs
      - name: Checksums
        run: |
          cd desktop/release
          sha256sum Pine-$VERSION-*.AppImage *.deb > SHA256SUMS-linux-${{ matrix.arch }}
          cat SHA256SUMS-linux-${{ matrix.arch }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: desktop/release/Pine-*
      - run: gh release upload "v$VERSION" desktop/release/Pine-$VERSION-*.AppImage desktop/release/*.deb desktop/release/SHA256SUMS-linux-${{ matrix.arch }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The Pine app of a release for Windows: an installer for each kind of processor, signed with
  # SignPath Foundation's certificate for open-source projects. Two jobs: app-windows packs the app's
  # folder on each processor and starts it once; app-windows-sign has both folders signed in one
  # request, makes the two installers from the signed folders, and has those signed in a second one.
  # So a release asks the owner for two approvals at signpath.io, not four.
  # It needs four secrets in the environment "release":
  #   SIGNPATH_API_TOKEN, SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG
  # and the project at signpath.io needs the two artifact configurations in desktop/signpath/
  # (slugs "app-folder" and "installer"). desktop/signpath/README.md says how it is set up.
  # Without the secrets nothing is built, and the job says so: an unsigned installer is one Windows
  # warns about on every download.
  app-windows:
    needs: release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          missing=""
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The Pine app for Windows was not built: the environment \"release\" has no SignPath secrets yet (see release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app for Windows cannot be signed: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: git config --global core.autocrlf false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop
      - if: steps.signing.outputs.ready == 'true'
        name: Pack the app's folder
        run: node desktop/scripts/pack.mjs --dir --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
      - if: steps.signing.outputs.ready == 'true'
        name: Start it once
        run: node desktop/scripts/smoke.mjs
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-${{ matrix.arch }}
          path: desktop/release/win-*unpacked/
          retention-days: 3

  app-windows-sign:
    needs: [release, app-windows]
    if: always() && needs.app-windows.result == 'success'
    runs-on: windows-latest
    # Each request waits for the owner's approval at signpath.io (an e-mail says one is waiting).
    timeout-minutes: 300
    environment: release
    permissions:
      contents: write # the installers go to the release
      actions: read # SignPath reads the artifacts it signs
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - id: signing
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_POLICY_SLUG: ${{ secrets.SIGNPATH_POLICY_SLUG }}
        run: |
          missing=""
          for name in SIGNPATH_API_TOKEN SIGNPATH_ORGANIZATION_ID SIGNPATH_PROJECT_SLUG SIGNPATH_POLICY_SLUG; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The Pine app for Windows was not built: the environment \"release\" has no SignPath secrets yet (see release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app for Windows cannot be signed: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: git config --global core.autocrlf false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pine-windows-x64
          path: desktop/release/unsigned/x64
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pine-windows-arm64
          path: desktop/release/unsigned/arm64
      - if: steps.signing.outputs.ready == 'true'
        id: unsigned
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-unsigned
          path: desktop/release/unsigned/
          retention-days: 3
      - if: steps.signing.outputs.ready == 'true'
        name: Sign both folders (waits for the approval at signpath.io)
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: desktop/release/signed
      - if: steps.signing.outputs.ready == 'true'
        name: The installers, from the signed folders
        run: |
          node desktop/scripts/pack.mjs --prepackaged desktop/release/signed/x64 --arch x64
          node desktop/scripts/pack.mjs --prepackaged desktop/release/signed/arm64 --arch arm64
          mkdir -p desktop/release/installers
          mv "desktop/release/Pine-$VERSION-x64-setup.exe" "desktop/release/Pine-$VERSION-arm64-setup.exe" desktop/release/installers/
        env:
          PINE_VERSION: ${{ env.VERSION }}
      - if: steps.signing.outputs.ready == 'true'
        id: installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pine-windows-installers
          path: desktop/release/installers/
          retention-days: 3
      - if: steps.signing.outputs.ready == 'true'
        name: Sign both installers (waits for the approval at signpath.io)
        uses: signpath/github-action-submit-signing-request@4a84eb4ad763290f059275786f2deed97c2c672b # v3.1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installers.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: desktop/release/out
      - if: steps.signing.outputs.ready == 'true'
        name: What another Windows will say to it
        shell: pwsh
        run: |
          $files = @(
            "desktop\release\out\Pine-$env:VERSION-x64-setup.exe",
            "desktop\release\out\Pine-$env:VERSION-arm64-setup.exe",
            "desktop\release\signed\x64\Pine.exe",
            "desktop\release\signed\arm64\Pine.exe"
          ) + (Get-ChildItem -Recurse -Path desktop\release\signed -Filter "pine-*.exe" | ForEach-Object { $_.FullName })
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne "Valid") { exit 1 }
          }
      - if: steps.signing.outputs.ready == 'true'
        run: gh release upload "v$VERSION" "desktop/release/out/Pine-$VERSION-x64-setup.exe" "desktop/release/out/Pine-$VERSION-arm64-setup.exe" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The Android app of a release (mobile/): a signed APK attached to the release, next to the disk images.
  android:
    needs: release
    # As the app job: after a release from main, or by hand for a release there already is.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the APK goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The Android app was not built: the environment \"release\" has no Android signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Android app cannot be signed: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor's Android code is built for Java 21
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop && npm ci --prefix mobile
      - if: steps.signing.outputs.ready == 'true'
        name: Check and test the mobile package
        # The bridge, the configuration and both builds of the page: an APK is built only from what passes.
        run: npm run check --prefix mobile && npm test --prefix mobile
      - if: steps.signing.outputs.ready == 'true'
        name: Build the page and a signed release APK
        # On the runner's Android SDK (ANDROID_HOME) and the JDK above. The Gradle build signs with the
        # key the environment names, and is given the release's version and its code.
        run: |
          PINE_VERSION_CODE="$(node mobile/scripts/version-code.ts "$VERSION")"
          export PINE_VERSION_CODE
          npm run apk:release --prefix mobile
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Pine-$VERSION.apk"
        env:
          PINE_VERSION: ${{ env.VERSION }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: steps.signing.outputs.ready == 'true'
        name: What a phone will say to it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "Pine-$VERSION.apk"
      - if: steps.signing.outputs.ready == 'true'
        run: gh release upload "v$VERSION" "Pine-$VERSION.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # The iOS app of a release (mobile/): an IPA that is not signed, attached next to the APK. Whoever
  # installs it signs it with their own Apple ID at that moment (AltStore, Sideloadly), so it needs
  # no secret and no environment: pine has no Apple certificate or profile, and wants none.
  ios:
    needs: release
    # As the app job: after a release from main, or by hand for a release there already is.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    # The image with Xcode 27 (a preview of GitHub's): the app's packages are held at versions that
    # compile on it (swift-collections), and the images up to macos-26 stop at Xcode 26.
    runs-on: xcode-27
    permissions:
      contents: write # the IPA goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Use Xcode 27
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no Xcode 27: $(ls -d /Applications/Xcode_*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - run: npm ci && npm ci --prefix desktop && npm ci --prefix mobile
      - name: Check and test the mobile package
        # The bridge, the configuration and both builds of the page: an IPA is built only from what passes.
        run: npm run check --prefix mobile && npm test --prefix mobile
      - name: Test the iOS core
        # The Swift core against an OpenSSH sshd of the test's own and a stand-in daemon.
        run: swift test --package-path mobile/ios-core
      - name: Build the page and an IPA that is not signed
        # Archived for devices with code signing off, version the release's and build number Android's
        # versionCode; the script fails unless the app inside is unsigned and arm64.
        run: |
          node mobile/scripts/ipa.ts "$VERSION"
          cp "mobile/ios/App/output/Pine-$VERSION.ipa" "Pine-$VERSION.ipa"
      - run: gh release upload "v$VERSION" "Pine-$VERSION.ipa" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
