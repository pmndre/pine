name: Release

# Every push to main publishes pine to npm. The version follows from the commits since the last
# release (see scripts/release.mjs): "feat:" raises the minor number, a breaking change the major
# one (the minor one below 1.0.0), anything else the patch number. A commit message that contains
# [skip release] publishes nothing.
#
# Every push to next publishes a preview of that release ("0.4.0-next.3") under npm's tag "next",
# marked as a pre-release on GitHub. "npm install -g @pmndre/pine" keeps getting the last release.
#
# A release from main also gets the Pine app (desktop/), for both kinds of Mac, attached to its
# GitHub release as disk images: signed with a Developer ID, notarised by Apple and checked the
# way another Mac checks it before it is uploaded. It is not started here: whether a packed app
# runs is tried on a developer's Mac (node desktop/scripts/smoke.mjs), not on every release. That
# needs five secrets, in an environment named "release" that is restricted to the branch main, so
# that no other branch can use them:
#   CSC_LINK            the "Developer ID Application" certificate with its key, a .p12 file, as base64
#   CSC_KEY_PASSWORD    the password of that file
#   APPLE_API_KEY       an App Store Connect API key: the text of its .p8 file
#   APPLE_API_KEY_ID    that key's ID
#   APPLE_API_ISSUER    the issuer ID shown above the keys
# Without them the app is not built, and the job says so: an app that is not signed and notarised
# is one macOS refuses to open, so none is handed out.
#
# A release from main also gets the Android app (mobile/), attached as Pine-<version>.apk, with
# versionName the release's version and versionCode major*1000000 + minor*1000 + patch
# (mobile/scripts/version-code.ts). It is signed with pine's release key, which takes four more
# secrets in the same environment "release":
#   ANDROID_KEYSTORE           the keystore with the key (a .jks or PKCS12 file), as base64
#   ANDROID_KEYSTORE_PASSWORD  the password of that file
#   ANDROID_KEY_ALIAS          the alias of the key in it
#   ANDROID_KEY_PASSWORD       the password of the key (for PKCS12, the same as the file's)
# Without any of them no APK is built, and the job says so; with only some of them it fails. Keep
# that key: Android installs an update only over an app signed with the same key.
#
# The unsigned iOS app (mobile/) is not built here for now: its core's tests do not pass on GitHub's
# Xcode 27 preview image. Its IPA is made by hand on a Mac (npm run ipa in mobile/): not signed,
# since whoever installs it signs it with their own Apple ID (AltStore, Sideloadly). Its version is
# the release's and its build number versionCode * 1000 + 999, the one its TestFlight build gets
# (iosVersion in mobile/scripts/version-code.ts).
#
# Every release from main and every preview from next also puts the iOS app on TestFlight
# (mobile/scripts/upload.ts): signed by the maintainer's Apple team with automatic signing
# (Apple's cloud-managed certificate, no certificate or profile stored), uploaded to App Store
# Connect, then for a release added to the external group "Public" (the public link) and submitted
# to Beta App Review, for a preview added to the internal group "Maintainers"
# (mobile/scripts/testflight.ts). That needs three secrets, in an environment named "testflight"
# restricted to the branches main and next, so that the secrets of "release" stay main's alone:
#   ASC_KEY        an App Store Connect API key with the Admin role (cloud-managed signing needs it): the text of its .p8 file
#   ASC_KEY_ID     that key's ID
#   ASC_ISSUER_ID  the issuer ID shown above the keys
# and two variables (Settings > Secrets and variables > Actions > Variables), which say whose app it is:
#   IOS_TEAM_ID    the Apple Developer team that signs it (ten capitals and digits, under Membership details)
#   IOS_BUNDLE_ID  the app's bundle id on that team; when it is not set, the project's own, dev.pmndre.pine
# Another maintainer's team takes over by changing those two variables and the three secrets, with
# no commit. Without the three secrets and IOS_TEAM_ID nothing is uploaded, the job passes and its
# summary says so; with only some of them it fails. No other job waits for it. A repository variable TESTFLIGHT_LINK (the public link, not a
# secret), when set, is written into the notes of each release from main.
#
# The apps of a release (the disk images, the APK and the TestFlight build) can be built again by hand, without publishing
# anything: Actions > Release > Run workflow, from main, with the release's version (gh workflow run
# release.yml -f version=0.38.0). They are built from that release's tag and attached to that
# release, in place of what is there.
#
# Publishing uses npm's trusted publishing: on npmjs.com, the package's settings name this
# repository and this workflow file as a trusted publisher, and no token is stored anywhere.
# A repository secret NPM_TOKEN, if there is one, is used instead.

on:
  push:
    branches: [main, next]
  workflow_dispatch:
    inputs:
      version:
        description: Build the Pine app again for this release and attach it (a version that has a release, like 0.38.0)
        required: true

permissions:
  contents: read

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # One at a time for a branch: the version is worked out from what npm has. A preview does not
    # wait for a release, and nothing waits for the app of a release to be built and notarised.
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # the release and its tag
      id-token: write # trusted publishing
    outputs:
      version: ${{ steps.publish.outputs.version }}
      channel: ${{ steps.publish.outputs.channel }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # the commits since the last release decide the version
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - id: publish
        run: node scripts/release.mjs
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TESTFLIGHT_LINK: ${{ vars.TESTFLIGHT_LINK }}

  # The Pine app of a release, once for each kind of Mac, on a runner of that kind: the app is
  # started there before it is uploaded.
  app:
    needs: release
    # After a release from main, or by hand for a release there already is (the release job is then skipped).
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    environment: release
    permissions:
      contents: write # the disk image, the zip and the feed go to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_TEXT: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_TEXT APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing ${name%_TEXT}"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 5 ]; then
            echo "::notice::The Pine app was not built: the environment \"release\" has no signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Pine app cannot be signed and notarised: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$APPLE_API_KEY_TEXT" > "$RUNNER_TEMP/app-store-connect.p8"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit. The history goes along, for what the package says each version changed.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24 # also the Node the app carries
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        name: Use the newest Xcode on the runner
        # pine's helpers are built here, and the voice helper uses the speech recognition of macOS 26
        # where a Mac has it: that takes the macOS 26 SDK, which the runner's default Xcode is too old for.
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          sdk="$(DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --sdk macosx --show-sdk-version)"
          echo "$xcode, macOS SDK $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::The newest Xcode on this runner has the macOS $sdk SDK; pine's helpers need 26 or newer."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop
      - if: steps.signing.outputs.ready == 'true'
        name: Pack, sign and notarise
        run: node desktop/scripts/pack.mjs --dmg --arch ${{ matrix.arch }}
        env:
          PINE_VERSION: ${{ env.VERSION }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/app-store-connect.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: steps.signing.outputs.ready == 'true'
        name: What another Mac will say to it
        run: |
          app="desktop/release/${{ matrix.arch == 'arm64' && 'mac-arm64' || 'mac' }}/Pine.app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - if: steps.signing.outputs.ready == 'true'
        # The disk image, and what the apps in the field update from: the app zipped after its ticket was
        # attached, and the feed that points at that zip on this release's tag (desktop/scripts/update-feed.ts).
        run: |
          gh release upload "v$VERSION" --clobber \
            "desktop/release/Pine-$VERSION-${{ matrix.arch }}.dmg" \
            "desktop/release/Pine-$VERSION-${{ matrix.arch }}.zip" \
            "desktop/release/Pine-${{ matrix.arch }}.json"
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/app-store-connect.p8"

  # The Android app of a release (mobile/): a signed APK attached to the release, next to the disk images.
  android:
    needs: release
    # As the app job: after a release from main, or by hand for a release there already is.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.channel == 'latest')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the APK goes to the release
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: signing
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0)."
            exit 1
          fi
          missing=""
          for name in ANDROID_KEYSTORE ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "$(printenv "$name")" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The Android app was not built: the environment \"release\" has no Android signing secrets yet (see the top of release.yml)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The Android app cannot be signed: these secrets are missing in the environment \"release\":$missing"
            exit 1
          else
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the release's own commit.
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.signing.outputs.ready == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21 # Capacitor's Android code is built for Java 21
      - if: steps.signing.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop && npm ci --prefix mobile
      - if: steps.signing.outputs.ready == 'true'
        name: Check and test the mobile package
        # The bridge, the configuration and both builds of the page: an APK is built only from what passes.
        run: npm run check --prefix mobile && npm test --prefix mobile
      - if: steps.signing.outputs.ready == 'true'
        name: The NDK that strips the APK's native libraries
        # The exact one mobile/android/variables.gradle names: without it AGP packages a native
        # library with its debug symbols and only warns. libwebrtc comes stripped, but a library
        # added later may not; the check after the build ("What a phone will say to it") fails then.
        run: |
          ndk="$(sed -n "s/^ *ndkVersion = '\(.*\)'/\1/p" mobile/android/variables.gradle)"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null
          echo "NDK_DIR=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
      - if: steps.signing.outputs.ready == 'true'
        name: Build the page and a signed release APK
        # On the runner's Android SDK (ANDROID_HOME) and the JDK above. The Gradle build signs with the
        # key the environment names, and is given the release's version and its code.
        run: |
          PINE_VERSION_CODE="$(node mobile/scripts/version-code.ts "$VERSION")"
          export PINE_VERSION_CODE
          npm run apk:release --prefix mobile
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Pine-$VERSION.apk"
        env:
          PINE_VERSION: ${{ env.VERSION }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - if: steps.signing.outputs.ready == 'true'
        name: What a phone will say to it
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "Pine-$VERSION.apk"
          # The native libraries went in stripped (a missing strip tool is only a warning of AGP's).
          unzip -q -o "Pine-$VERSION.apk" 'lib/*' -d "$RUNNER_TEMP/apk-lib"
          for so in "$RUNNER_TEMP"/apk-lib/lib/*/*.so; do
            if "$NDK_DIR"/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -S "$so" | grep -q '\.debug_info'; then
              echo "::error::$so carries its debug symbols: the NDK's strip tool was not found."
              exit 1
            fi
          done
      - if: steps.signing.outputs.ready == 'true'
        name: What the APK asks of a phone
        # The permissions of what was built, not of the manifest: a library added later can bring one
        # of its own in when the manifests are merged. Exactly the network and its state, and the
        # signature permission androidx.core declares under the package's name for its own receivers
        # (DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION), which only this app holds and no owner grants.
        run: |
          aapt2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2"
          app=dev.pmndre.pine
          printf '%s\n' \
            "permission: $app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" \
            "uses-permission: name='$app.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION'" \
            "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" \
            "uses-permission: name='android.permission.INTERNET'" | LC_ALL=C sort > "$RUNNER_TEMP/permissions-wanted"
          "$aapt2" dump permissions "Pine-$VERSION.apk" | grep -v '^package: ' | LC_ALL=C sort > "$RUNNER_TEMP/permissions-asked"
          if ! diff -u "$RUNNER_TEMP/permissions-wanted" "$RUNNER_TEMP/permissions-asked"; then
            echo "::error::The APK asks for other permissions than INTERNET and ACCESS_NETWORK_STATE (the lines with + above): find what brought them in (the merged manifest, app/build/intermediates/merged_manifests) and remove them, or change this check knowingly."
            exit 1
          fi
      - if: steps.signing.outputs.ready == 'true'
        run: gh release upload "v$VERSION" "Pine-$VERSION.apk" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # The iOS app on TestFlight (mobile/scripts/upload.ts): signed by the maintainer's Apple team,
  # uploaded to App Store Connect and distributed by mobile/scripts/testflight.ts. A release from
  # main goes to the external group with the public link and to Beta App Review, a preview from next
  # to the internal group. Nothing waits for it: a failed upload holds back neither npm nor the
  # other apps.
  testflight:
    needs: release
    # After every release and every preview (a commit that says [skip release] gives no version), or
    # by hand for a release there already is. A build App Store Connect has already is not uploaded
    # again, and is distributed as it is.
    if: always() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.version != '')
    concurrency:
      group: testflight-${{ github.ref_name }}
      cancel-in-progress: false
    # The image with Xcode 27 (a preview of GitHub's): the app's packages are held at versions that
    # compile on it (swift-collections), and the images up to macos-26 stop at Xcode 26.
    runs-on: xcode-27
    environment: testflight
    env:
      VERSION: ${{ inputs.version || needs.release.outputs.version }}
    steps:
      - id: key
        # Only whether each secret and the team variable is there: their values go to the upload step alone.
        env:
          HAS_ASC_KEY: ${{ secrets.ASC_KEY != '' }}
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID != '' }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-next\.[0-9]+)?$'; then
            echo "::error::\"$VERSION\" is not the version of a release (like 0.38.0) or of a preview (like 0.38.0-next.4)."
            exit 1
          fi
          missing=""
          for name in ASC_KEY ASC_KEY_ID ASC_ISSUER_ID IOS_TEAM_ID; do
            if [ "$(printenv "HAS_$name")" != "true" ]; then missing="$missing $name"; fi
          done
          if [ "$(echo $missing | wc -w)" -eq 4 ]; then
            echo "::notice::The iOS app was not uploaded to TestFlight: there is no App Store Connect key and no signing team yet (see the top of release.yml)."
            echo "Nothing was uploaded to TestFlight: the environment \"testflight\" has no App Store Connect key (ASC_KEY, ASC_KEY_ID, ASC_ISSUER_ID) and the repository no variable IOS_TEAM_ID." >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$missing" ]; then
            echo "::error::The iOS app cannot be signed for TestFlight: these are missing (secrets of the environment \"testflight\", or the variable IOS_TEAM_ID):$missing"
            exit 1
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # By hand: the version's own commit, whose subject is the build's "What to Test".
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.sha }}
          persist-credentials: false
      - if: steps.key.outputs.ready == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - if: steps.key.outputs.ready == 'true'
        name: Use Xcode 27, not a beta
        # App Store Connect refuses an upload built with a beta Xcode ("Unsupported SDK or Xcode
        # version"), so a beta on the runner is passed over.
        run: |
          xcode="$(ls -d /Applications/Xcode_27*.app 2>/dev/null | grep -viE 'beta|_rc' | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::This runner has no released Xcode 27, which App Store Connect requires for an upload: $(ls -d /Applications/Xcode_*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          DEVELOPER_DIR="$xcode/Contents/Developer" xcodebuild -version
      - if: steps.key.outputs.ready == 'true'
        run: npm ci && npm ci --prefix desktop && npm ci --prefix mobile
      - if: steps.key.outputs.ready == 'true'
        name: Check and test the mobile package
        # The bridge, the configuration and both builds of the page: a build is uploaded only from what
        # passes. The iOS core's swift test is not run here for now: it does not pass on this image.
        run: npm run check --prefix mobile && npm test --prefix mobile
      - if: steps.key.outputs.ready == 'true'
        name: Sign, upload and distribute
        # The script writes the key into a folder of its own under RUNNER_TEMP and removes it when it
        # ends; xcodebuild and testflight.ts are given that file, never its content.
        run: node mobile/scripts/upload.ts --version "$VERSION"
        env:
          TMPDIR: ${{ runner.temp }}
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      - if: always()
        run: rm -rf "$RUNNER_TEMP"/pine-asc-*
