name: Web preview

# The web client on every pull request that touches it, and on every push to next and main that
# does: the gates of web/ and web/relay/, the build as by hand (`pnpm run build` in web/), then a
# whole deployment of web/relay (the web client, the SSH relay and the meeting service) as a
# Worker of its own for the channel: `pine-pr-<number>` for a pull request, `pine-next` and
# `pine-main` for those branches, each at pine-<channel>.<account>.workers.dev. Each push deploys
# its channel's Worker again. A pull request's address is posted on it as one comment, updated on
# each push; a branch's is in the run's summary. When a pull request is closed, its Worker is
# deleted. pine-main is the service the apps use by default (`OFFICIAL_SERVICE` in
# desktop/src/machines.ts).
#
# Each channel is a Worker of its own, not a version of one Worker: a Worker that holds a Durable
# Object (the meeting service) gets no version preview addresses. The secrets live in the
# environment `web-preview`, which only the deploy and delete jobs name, and they run only for a
# branch of this repository: a pull request from a fork is built and tested and never reaches the
# secrets. Without them those jobs say that they deployed or deleted nothing, and pass.

on:
  pull_request:
    # closed: the pull request's Worker is deleted (the job cleanup).
    types: [opened, synchronize, reopened, closed]
    paths: &paths
      - "web/**"
      - "desktop/src/**"
      - "desktop/vite.config.ts"
      - "desktop/electron/daemon.ts"
      - "desktop/package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # The desktop page measures a sound's levels with the terminal UI's code.
      - "src/tui/levels.ts"
      # web/test/peer.test.ts runs the Pine app's access host, which runs the remote command.
      - "desktop/electron/access/**"
      - "src/remote.ts"
      - ".github/workflows/web-preview.yml"
  push:
    branches: [next, main]
    paths: *paths

permissions:
  contents: read

concurrency:
  # One group per channel (pr-<number>, next, main), so that two runs never deploy one Worker at once.
  group: web-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  # A pull request's newer push replaces its run, and so does its closing, whose delete then comes
  # after any deploy; on next and main every push runs to the end, so that each commit there has its
  # own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      # web/'s tests start an sshd of their own on a loopback port (test/support/machine.ts).
      - name: sshd for the SSH core's tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
      - run: pnpm install --frozen-lockfile --filter pine-desktop --filter @pmndre/pine-web --filter @pmndre/pine-relay
      - name: Chrome for Testing for the SSH core's tests
        run: pnpm exec playwright-core install --with-deps chromium
        working-directory: web
      - run: pnpm run check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm run check
        working-directory: web/relay
      - run: pnpm test
        working-directory: web/relay
      - run: pnpm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      - name: Say why a fork gets no preview
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "A pull request from a fork is built and tested, and never deployed. Nothing deployed." >> "$GITHUB_STEP_SUMMARY"

  preview:
    needs: build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: web-preview
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    # The Cloudflare secrets are in the env of the deploy step alone, so that nothing else the job
    # runs (an install script of a dependency) sees them.
    env:
      # A pull request's channel is pr-<number>; a push's is its branch, next or main.
      WORKER: pine-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # No install scripts: wrangler only bundles and uploads here, which esbuild does from its
      # platform package without its own postinstall check, and workerd is not run.
      - run: pnpm install --frozen-lockfile --ignore-scripts --filter @pmndre/pine-relay
      - name: Deploy the channel's Worker
        id: deploy
        working-directory: web/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the environment web-preview: nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PR" ]; then message="PR #$PR at ${SHA:0:7}"; else message="${GITHUB_REF_NAME} at ${SHA:0:7}"; fi
          pnpm exec wrangler deploy --name "$WORKER" --message "$message" 2>&1 | tee deploy.log
          # wrangler lists what it deployed, the workers.dev address on a line of its own.
          url=$(grep -Eo "https://$WORKER\.[A-Za-z0-9.-]+\.workers\.dev" deploy.log | head -n 1)
          if [ -z "$url" ]; then
            echo "wrangler deployed no workers.dev address for $WORKER: see the log above." >&2
            exit 1
          fi
          echo "Deployed $WORKER: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"

  # Apart from the deploy, so that only a pull request's run holds a token that writes to pull
  # requests, and the job that holds it has no Cloudflare secret.
  comment:
    needs: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Post the address on the pull request
        env:
          URL: ${{ needs.preview.outputs.url }}
        run: |
          marker='<!-- pine-web-preview -->'
          if [ -n "$URL" ]; then
            body="$marker
          **Web client preview:** $URL

          The build of ${SHA:0:7}, a whole deployment of its own (the web client, the SSH relay and the meeting service), deleted when this pull request is closed. It reaches a machine with a public SSH address, or one on a tailnet through Tailscale Funnel (\`user@machine.tailnet.ts.net:10000\`): add yours in Settings > Environments, with this browser's key in its \`authorized_keys\`. To try pairing, give this address as the Service address in the Pine app's Settings > Browser access."
          else
            body="$marker
          **Web client preview:** nothing deployed for ${SHA:0:7}. The secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not set in the environment \`web-preview\`; the build and its tests passed."
          fi
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # When a pull request is closed (merged or not): its Worker is deleted. Like the deploy, only for
  # a branch of this repository, with the secrets in the env of the delete step alone.
  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: web-preview
    env:
      WORKER: pine-pr-${{ github.event.pull_request.number }}
    steps:
      # The API, not `wrangler delete`: wrangler then also looks for KV namespaces to clean up, which
      # needs a permission the token does not have, and fails after the Worker is gone.
      - name: Delete the pull request's Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the environment web-preview: nothing deleted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # force=true: its Durable Object namespace goes with it; nothing else depends on a pull request's Worker.
          status=$(curl -sS -o delete.json -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER?force=true")
          cat delete.json; echo
          if [ "$status" = 200 ]; then
            echo "Deleted $WORKER." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q '"code":10007' delete.json; then
            # A pull request whose runs deployed nothing (no secrets then, or closed before a deploy).
            echo "$WORKER does not exist: nothing deleted." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Deleting $WORKER failed with HTTP $status." >&2
            exit 1
          fi
