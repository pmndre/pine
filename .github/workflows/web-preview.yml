name: Web preview

# The web client on every pull request that touches it: the gates of web/ and web/relay/, the
# build as by hand (`npm run build` in web/), then a Workers version of the relay with the build,
# uploaded under a preview alias of its own (`pr-<number>`) on the Worker's workers.dev address.
# The address is posted on the pull request as one comment, updated on each push.
#
# Nothing is deployed from next or main: the Worker's live version is never changed here. The
# secrets live in the environment `web-preview`, which only the second job names, and that job
# runs only for a branch of this repository: a pull request from a fork is built and tested and
# never reaches the secrets. Without them the job says that it deployed nothing, and passes.

on:
  pull_request:
    paths:
      - "web/**"
      - "desktop/src/**"
      - "desktop/vite.config.ts"
      - "desktop/electron/daemon.ts"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      # The desktop page measures a sound's levels with the terminal UI's code.
      - "src/tui/levels.ts"
      - ".github/workflows/web-preview.yml"

permissions:
  contents: read

concurrency:
  group: web-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      # web/'s tests start an sshd of their own on a loopback port (web/testing/machine.ts).
      - name: sshd for the SSH core's tests
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo mkdir -p /run/sshd
      - run: npm ci
        working-directory: desktop
      - run: npm ci
        working-directory: web
      - run: npm ci
        working-directory: web/relay
      - name: Chrome for Testing for the SSH core's tests
        run: npx playwright-core install --with-deps chromium
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run check
        working-directory: web/relay
      - run: npm test
        working-directory: web/relay
      - run: npm run build
        working-directory: web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
      - name: Say why a fork gets no preview
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "A pull request from a fork is built and tested, and never previewed. Nothing deployed." >> "$GITHUB_STEP_SUMMARY"

  preview:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: web-preview
    permissions:
      contents: read
      pull-requests: write
    # The Cloudflare secrets are in the env of the upload step alone, so that nothing else the job
    # runs (an install script of a dependency) sees them.
    env:
      ALIAS: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      # No install scripts: wrangler only bundles and uploads here, which esbuild does from its
      # platform package without its own postinstall check, and workerd is not run.
      - run: npm ci --ignore-scripts
        working-directory: web/relay
      - name: Upload a version under the pull request's alias
        id: upload
        working-directory: web/relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the environment web-preview: nothing deployed." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx wrangler versions upload --preview-alias "$ALIAS" --message "PR #$PR at ${SHA:0:7}" 2>&1 | tee upload.log
          url=$(grep -Eo 'Alias URL: https://[^ ]+' upload.log | head -n 1 | sed 's/^Alias URL: //')
          if [ -z "$url" ]; then
            echo "wrangler uploaded no version with a preview alias address: see the log above." >&2
            exit 1
          fi
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the address on the pull request
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: |
          marker='<!-- pine-web-preview -->'
          if [ -n "$URL" ]; then
            body="$marker
          **Web client preview:** $URL

          The build of ${SHA:0:7}, served by its own version of the relay. It reaches a machine with a public SSH address, or one on a tailnet through Tailscale Funnel (\`user@machine.tailnet.ts.net:10000\`): add yours in Settings > Environments, with this browser's key in its \`authorized_keys\`."
          else
            body="$marker
          **Web client preview:** nothing deployed for ${SHA:0:7}. The secrets \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are not set in the environment \`web-preview\`; the build and its tests passed."
          fi
          id=$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GH_REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
