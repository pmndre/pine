name: Chromatic

# The desktop app's stories (desktop/src/*.stories.tsx), published to Chromatic: a place to look
# at the app's parts, not a test. It never runs on a pull request, so it puts no check there: a
# picture that changed is what a change to the page is for, and Chromatic's capture has failed
# stories that render without an error in Chromium (four of them, on every pull request after #71).
# A push to `next` publishes the stories and is accepted as it is (`autoAcceptChanges`), which
# keeps the baseline. To look at a branch's pictures against it, run this workflow by hand on that
# branch (Actions > Chromatic > Run workflow, or `gh workflow run chromatic.yml --ref <branch>`).
# Without the CHROMATIC_PROJECT_TOKEN secret (a fork, or a repository not set up for it) the job
# says so and passes.

on:
  push:
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Skip without a project token
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo "CHROMATIC_PROJECT_TOKEN is not set; Chromatic is skipped."
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          fetch-depth: 0 # Chromatic compares with the builds of earlier commits
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        working-directory: desktop
      - uses: chromaui/action@9cb4d65a86fe1c4c67a76a8d90f35a51a118e55f # v18.15.1
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          workingDir: desktop
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          onlyChanged: true
          exitZeroOnChanges: true
          autoAcceptChanges: next
        # What Chromatic finds is for a person to look at; it never fails the run.
        continue-on-error: true
