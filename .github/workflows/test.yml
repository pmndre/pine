name: Test

# pine's tests on every system it runs on, on every push to next and every pull request against
# main. A pull request against next runs them on Linux (x64) alone: the other systems are slow and
# costly, and they are run on next once it is merged, before anything is released from there. A file
# with a failure is run again alone (scripts/test.mjs): one that passes then was a wait that ran out
# on a slow runner, and does not fail the run.
#
# pine: the type check and `pnpm test` on Linux (x64 and arm64), macOS and Windows. On Linux the
# sandbox is set up first the way an owner sets it up, with `pine init` (bubblewrap, and the
# AppArmor rule Ubuntu 24.04 needs), so that the tests that run commands in the sandbox run there
# and are not skipped. On Windows pine has no sandbox yet: those tests skip themselves, each with
# the reason why.
#
# The Pine app (desktop/): its tests drive the real app through its window, on macOS and on Linux
# under a virtual screen. They run when the app or the parts of pine it talks to change.

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

# One run at a time for a branch, and a run that has started is finished: the Windows job takes
# longer than the time between two pushes, and would otherwise never be seen to the end. (A run
# that waits is replaced by the next push's.)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

# The release's pull request (next into main) runs nothing: each push to next is tested by its push
# run, on the same commit and the same systems, and its checks show on the pull request. Running both
# asks for two macOS runners at once, and when GitHub has too few, one is never given a runner and the
# run fails after a quarter of an hour without a test having failed. (desktop and pack need
# desktop-changed, so they are skipped with it.)
jobs:
  pine:
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-latest"]') }}
    runs-on: ${{ matrix.runner }}
    # macOS's runners take the longest: close to half an hour for the whole suite.
    timeout-minutes: 45
    steps:
      # The files as they are in the repository, with the line ends they have there (git on
      # Windows would otherwise turn them into CRLF, which the tests that read pine's own docs see).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter @pmndre/pine
      - run: pnpm run check
      - name: Set up the sandbox as pine init does
        if: runner.os == 'Linux'
        env:
          PINE_HOME: ${{ runner.temp }}/pine-home
          PINE_SKIP_DOWNLOADS: "1"
        run: node src/cli.ts init --yes
      - name: Say which sandbox the tests get
        shell: bash
        run: |
          node --input-type=module -e 'import { sandboxKind, sandboxMissing } from "./src/security.ts"; console.log(`sandbox: ${sandboxKind() ?? "none"} on ${process.platform} ${sandboxMissing()}`)'
      # A test that hangs fails after three minutes, instead of holding the job until its own limit.
      # The runners are slower than a computer at a desk: the tests' waits are four times as long.
      - run: node scripts/test.mjs --test-force-exit --test-timeout=180000 "test/*.test.ts"
        env:
          PINE_TEST_PATIENCE: "4"

  desktop-changed:
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch or a forced push has no usable "before": then everything counts as changed.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" HEAD | grep -Eq '^(desktop/|src/(http|owner|service|remote|csharp)\.ts$|scripts/helpers\.mjs$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.github/workflows/test\.yml$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    needs: desktop-changed
    if: needs.desktop-changed.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What Linux needs to build node-pty and to show a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          # Electron's own sandbox makes a user namespace, which Ubuntu 24.04 allows only to
          # programs with an AppArmor rule. A test runner has no reason to keep that restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
      - name: Set up the sandbox as pine init does
        if: runner.os == 'Linux'
        env:
          PINE_HOME: ${{ runner.temp }}/pine-home
          PINE_SKIP_DOWNLOADS: "1"
        run: node src/cli.ts init --yes
      # The app runs pine on the owner's Node, found by the login shell's PATH: on a runner that is an
      # older one than the job's. PINE_NODE names the job's.
      - run: echo "PINE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - run: pnpm run check
        working-directory: desktop
      - name: The app's tests
        if: runner.os == 'macOS'
        run: pnpm run desktop:test
        env:
          PINE_TEST_PATIENCE: "4"
      - name: The app's tests, on a virtual screen
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm run desktop:test
        env:
          PINE_TEST_PATIENCE: "4"
          # The windows are shown on the virtual screen: an X server gives a window that was never
          # mapped no keyboard focus, and nothing there reaches anybody's own screen.
          PINE_DESKTOP_SHOW: "1"

  # The Pine app packed for Linux and Windows as a release packs it (unsigned, the app's folder
  # alone), and started once from there: whether it runs on the pine and the Node it carries.
  pack:
    needs: desktop-changed
    if: needs.desktop-changed.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux on arm64 too for a push to next, so that the AppImage's repack is tried on both
        # processors a release packs on before one does.
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "ubuntu-24.04-arm", "windows-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What node-pty is built with, and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile --filter @pmndre/pine --filter pine-desktop
        shell: bash
      - name: Pack
        run: node desktop/scripts/pack.mjs --dir
        env:
          PINE_VERSION: "9.8.7"
      - name: Start it once (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node desktop/scripts/smoke.mjs
      - name: Start it once (Windows)
        if: runner.os == 'Windows'
        run: node desktop/scripts/smoke.mjs
      # The AppImage as a release hands it out (app-linux): made from the folder packed above, then
      # repacked with its update information, its .zsync and its AppStream metainfo.
      - name: The AppImage, with its update information (Linux)
        if: runner.os == 'Linux'
        env:
          PINE_VERSION: "9.8.7"
        run: |
          case "$(uname -m)" in x86_64) arch=x86_64 folder=linux-unpacked ;; *) arch=arm64 folder=linux-arm64-unpacked ;; esac
          node desktop/scripts/pack.mjs --prepackaged "desktop/release/$folder"
          image="desktop/release/Pine-9.8.7-$arch.AppImage"
          sh desktop/scripts/appimage-update.sh "$image"
          want="gh-releases-zsync|pmndre|pine|latest|Pine-*-$arch.AppImage.zsync"
          said="$("$image" --appimage-updateinformation)"
          if [ "$said" != "$want" ]; then echo "::error::$image says its update information is \"$said\", not \"$want\""; exit 1; fi
          if [ ! -s "$image.zsync" ]; then echo "::error::no $image.zsync"; exit 1; fi
          sudo apt-get install -y appstream
          cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$image" --appimage-extract >/dev/null
          appstreamcli validate --no-net squashfs-root/usr/share/metainfo/dev.pine.desktop.metainfo.xml
          appstreamcli validate-tree --no-net squashfs-root
      # What a release's code signing checks on every file it signs (desktop/signpath/): the product's
      # name and the release's version. And the installer made from a folder packed before, as the
      # release makes it from the signed one.
      - name: The installer, and what the files say they are (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PINE_VERSION: "9.8.7"
        run: |
          node desktop/scripts/pack.mjs --prepackaged desktop/release/win-unpacked --arch x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $files = @("desktop\release\Pine-9.8.7-x64-setup.exe", "desktop\release\win-unpacked\Pine.exe") + (Get-ChildItem -Recurse -Path desktop\release\win-unpacked\resources\pine -Filter "pine-*.exe" | Where-Object { $_.FullName -match "\\prebuilt\\" } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 5) { "expected the installer, Pine.exe and three helpers, found: $files"; exit 1 }
          foreach ($f in $files) {
            $v = (Get-Item -LiteralPath $f).VersionInfo
            "$f : $($v.ProductName) $($v.ProductVersion)"
            if ($v.ProductName -ne "Pine" -or $v.ProductVersion -ne "9.8.7") { exit 1 }
          }
