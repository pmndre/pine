name: Test

# pine's tests on every system it runs on, on every push to next and every pull request against
# main. A pull request against next runs them on Linux (x64) alone: the other systems are slow and
# costly, and they are run on next once it is merged, before anything is released from there. A file
# with a failure is run again alone (scripts/test.mjs): one that passes then was a wait that ran out
# on a slow runner, and does not fail the run. A pull request that changes only what pine's tests
# never read (the Pine app's own code, the web client, the mobile app) does not run them (changes).
#
# pine: the type check and `npm test` on Linux (x64 and arm64), macOS and Windows. On Linux the
# sandbox is set up first the way an owner sets it up, with `pine init` (bubblewrap, and the
# AppArmor rule Ubuntu 24.04 needs), so that the tests that run commands in the sandbox run there
# and are not skipped. On Windows pine has no sandbox yet: those tests skip themselves, each with
# the reason why.
#
# The tests are cut into shards, each on a runner of its own (`--test-shard`, which deals the test
# files out in turn by their place in the sorted list): three on macOS, two on Linux and on Windows.
# No file holds more than a tenth of the time, so dealing them out in turn gives shards within about
# a quarter of each other. macOS has the most to gain, from close to half an hour to about ten
# minutes, but its runners are the scarcest: three at once is a bet that GitHub has them, and more
# would ask too much (see the note above `jobs:`; the desktop job wants one more when it runs). On
# Linux and Windows every shard repeats `npm ci`, the type check and, on Linux, `pine init`, close to
# a minute, so a third shard would cost more runner time than it saves.
#
# timing: how long this run's tests took on each system, all shards from the first start to the
# last end and the runner time they used, beside the last run of a push to next, in the run's
# summary. It only reads, and it never fails the run.
#
# The Pine app (desktop/): its tests drive the real app through its window, on macOS and on Linux
# under a virtual screen. They run when the app or the parts of pine it talks to change.

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

# One run at a time for a branch, and a run that has started is finished: the Windows job takes
# longer than the time between two pushes, and would otherwise never be seen to the end. (A run
# that waits is replaced by the next push's.)
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

# The release's pull request (next into main) runs nothing: each push to next is tested by its push
# run, on the same commit and the same systems, and its checks show on the pull request. Running both
# asks for two macOS runners at once, and when GitHub has too few, one is never given a runner and the
# run fails after a quarter of an hour without a test having failed. (pine, desktop and pack need
# changes, so they are skipped with it.)
jobs:
  # What a change touches. desktop: the Pine app, or the parts of pine it talks to (the desktop and
  # pack jobs). pine: anything that can reach pine's own tests (the pine job). pine is skipped only
  # for a pull request whose every file lies where those tests read nothing: the Pine app's own code
  # (desktop/, but not desktop/scripts/, whose failed-files.mjs scripts/test.mjs uses), the web
  # client (web/, but not web/src/remote-command.ts, which a test imports) and the mobile app
  # (mobile/, but not mobile/cases/, which a test reads). Everything else counts, docs and examples
  # among them, since the tests read pine's own. A push to next always runs it: that run is what a
  # release is made from. A job skipped by its `if:` passes a required check, where a workflow that
  # does not run at all (`paths:`) would leave it waiting forever, so the choice is made here.
  changes:
    if: github.event_name != 'pull_request' || github.head_ref != 'next' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      pine: ${{ steps.filter.outputs.pine }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          # A new branch or a forced push has no usable "before": then everything counts as changed.
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            echo "pine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The names in a file rather than a pipe: grep -q stops at the first match, and under
          # pipefail the git that it stops reading would make the test say no.
          changed="$RUNNER_TEMP/changed"
          git diff --name-only "$BASE" HEAD > "$changed"
          if grep -Eq '^(desktop/|src/(http|owner|service|remote|csharp)\.ts$|scripts/helpers\.mjs$|\.github/workflows/test\.yml$)' "$changed"; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi
          # pine: for anything but a pull request, for a pull request that changes no file, and for
          # one with a file outside desktop/, web/ and mobile/ or in the parts of them the tests read.
          if [ "$EVENT" != "pull_request" ] || [ ! -s "$changed" ] \
            || grep -Evq '^(desktop|web|mobile)/' "$changed" \
            || grep -Eq '^(desktop/scripts/|mobile/cases/|web/src/remote-command\.ts$)' "$changed"; then
            echo "pine=true" >> "$GITHUB_OUTPUT"
          else
            echo "pine=false" >> "$GITHUB_OUTPUT"
          fi

  pine:
    needs: changes
    if: needs.changes.outputs.pine == 'true'
    name: pine (${{ matrix.runner }}, ${{ matrix.shard }}/${{ matrix.of }})
    strategy:
      fail-fast: false
      matrix:
        # Each entry is one shard: the runner, which shard it is, and how many that runner's suite is cut into.
        include: >-
          ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '[
            {"runner": "ubuntu-24.04", "shard": 1, "of": 2}, {"runner": "ubuntu-24.04", "shard": 2, "of": 2}
          ]' || '[
            {"runner": "ubuntu-24.04", "shard": 1, "of": 2}, {"runner": "ubuntu-24.04", "shard": 2, "of": 2},
            {"runner": "ubuntu-24.04-arm", "shard": 1, "of": 2}, {"runner": "ubuntu-24.04-arm", "shard": 2, "of": 2},
            {"runner": "macos-15", "shard": 1, "of": 3}, {"runner": "macos-15", "shard": 2, "of": 3}, {"runner": "macos-15", "shard": 3, "of": 3},
            {"runner": "windows-latest", "shard": 1, "of": 2}, {"runner": "windows-latest", "shard": 2, "of": 2}
          ]') }}
    runs-on: ${{ matrix.runner }}
    # macOS's runners take the longest: close to half an hour for the whole suite, about ten minutes
    # for a third of it. The limit is kept for a slow day.
    timeout-minutes: 45
    steps:
      # The files as they are in the repository, with the line ends they have there (git on
      # Windows would otherwise turn them into CRLF, which the tests that read pine's own docs see).
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - name: Set up the sandbox as pine init does
        if: runner.os == 'Linux'
        env:
          PINE_HOME: ${{ runner.temp }}/pine-home
          PINE_SKIP_DOWNLOADS: "1"
        run: node src/cli.ts init --yes
      - name: Say which sandbox the tests get
        shell: bash
        run: |
          node --input-type=module -e 'import { sandboxKind, sandboxMissing } from "./src/security.ts"; console.log(`sandbox: ${sandboxKind() ?? "none"} on ${process.platform} ${sandboxMissing()}`)'
      # A test that hangs fails after three minutes, instead of holding the job until its own limit.
      # The runners are slower than a computer at a desk: the tests' waits are four times as long.
      # The shard comes before the files' pattern: what follows the pattern is not read as an option,
      # and the whole suite would run in every shard.
      - run: node scripts/test.mjs --test-force-exit --test-timeout=180000 --test-shard=${{ matrix.shard }}/${{ matrix.of }} "test/*.test.ts"
        env:
          PINE_TEST_PATIENCE: "4"

  timing:
    needs: [changes, pine]
    if: always() && needs.changes.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A table in a summary is no reason for a red run: whatever goes wrong here is only said.
    continue-on-error: true
    permissions:
      actions: read
    steps:
      - name: How long the tests took, beside the last push to next
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
          PINE: ${{ needs.pine.result }}
        run: |
          if [ "$PINE" = "skipped" ]; then
            echo "pine's tests did not run: nothing this pull request changes can reach them." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The jobs of the pine job, grouped by the runner they asked for (so that a run whose jobs
          # were not yet cut into shards, named "pine (macos-15)", is grouped as well as one whose
          # jobs were): from the first start to the last end, and the time of all of them added up.
          per_runner='[.[] | select((.name | startswith("pine (")) and .conclusion != "skipped" and .started_at != null and .completed_at != null)
            | {runner: .labels[0], start: (.started_at | fromdate), end: (.completed_at | fromdate)}]
            | group_by(.runner)
            | map({key: .[0].runner, value: {wall: ((map(.end) | max) - (map(.start) | min)), used: (map(.end - .start) | add), jobs: length}})
            | from_entries'
          now=$(gh api --paginate "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq '.jobs[]' | jq -s "$per_runner")
          base_run=$(gh api "repos/$REPO/actions/workflows/test.yml/runs?branch=next&event=push&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$base_run" ]; then
            base=$(gh api --paginate "repos/$REPO/actions/runs/$base_run/jobs?per_page=100" --jq '.jobs[]' | jq -s "$per_runner")
          else
            base='{}'
          fi
          {
            echo "## How long pine's tests took"
            echo
            if [ -n "$base_run" ]; then
              echo "Beside the last successful push to next: [run $base_run](https://github.com/$REPO/actions/runs/$base_run)."
            else
              echo "No successful push to next was found to compare with."
            fi
            echo
            echo "| Runner | Last push to next | This run, first start to last end | This run, runner time | Change |"
            echo "|---|---|---|---|---|"
            jq -n -r --argjson now "$now" --argjson base "$base" '
              def t: if . == null then "-" else "\(. / 60 | floor)m \(. % 60)s" end;
              (($now | keys) + ($base | keys) | unique)[] as $r
              | ($now[$r]) as $n | ($base[$r]) as $b
              | "| \($r) | \($b.wall | t) | \($n.wall | t) (\($n.jobs // 0) \(if $n.jobs == 1 then "job" else "jobs" end)) | \($n.used | t) | "
                + (if $n == null or $b == null then "-" else "\(($n.wall - $b.wall) | if . < 0 then "-" + (-. | t) else "+" + t end) (\((($n.wall - $b.wall) * 100 / $b.wall) | round | if . > 0 then "+\(.)" else tostring end)%)" end)
                + " |"'
          } >> "$GITHUB_STEP_SUMMARY"

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "macos-15"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What Linux needs to build node-pty and to show a window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          # Electron's own sandbox makes a user namespace, which Ubuntu 24.04 allows only to
          # programs with an AppArmor rule. A test runner has no reason to keep that restriction.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - name: Set up the sandbox as pine init does
        if: runner.os == 'Linux'
        env:
          PINE_HOME: ${{ runner.temp }}/pine-home
          PINE_SKIP_DOWNLOADS: "1"
        run: node src/cli.ts init --yes
      - run: npm ci
        working-directory: desktop
      # The app runs pine on the owner's Node, found by the login shell's PATH: on a runner that is an
      # older one than the job's. PINE_NODE names the job's.
      - run: echo "PINE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - run: npm run check
        working-directory: desktop
      - name: The app's tests
        if: runner.os == 'macOS'
        run: npm run desktop:test
        env:
          PINE_TEST_PATIENCE: "4"
      - name: The app's tests, on a virtual screen
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run desktop:test
        env:
          PINE_TEST_PATIENCE: "4"
          # The windows are shown on the virtual screen: an X server gives a window that was never
          # mapped no keyboard focus, and nothing there reaches anybody's own screen.
          PINE_DESKTOP_SHOW: "1"

  # The Pine app packed for Linux and Windows as a release packs it (unsigned, the app's folder
  # alone), and started once from there: whether it runs on the pine and the Node it carries.
  pack:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-24.04"]' || '["ubuntu-24.04", "windows-latest"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: What node-pty is built with, and a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci && npm ci --prefix desktop
        shell: bash
      - name: Pack
        run: node desktop/scripts/pack.mjs --dir
        env:
          PINE_VERSION: "9.8.7"
      - name: Start it once (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node desktop/scripts/smoke.mjs
      - name: Start it once (Windows)
        if: runner.os == 'Windows'
        run: node desktop/scripts/smoke.mjs
      # What a release's code signing checks on every file it signs (desktop/signpath/): the product's
      # name and the release's version. And the installer made from a folder packed before, as the
      # release makes it from the signed one.
      - name: The installer, and what the files say they are (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PINE_VERSION: "9.8.7"
        run: |
          node desktop/scripts/pack.mjs --prepackaged desktop/release/win-unpacked --arch x64
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $files = @("desktop\release\Pine-9.8.7-x64-setup.exe", "desktop\release\win-unpacked\Pine.exe") + (Get-ChildItem -Recurse -Path desktop\release\win-unpacked\resources\pine -Filter "pine-*.exe" | Where-Object { $_.FullName -match "\\prebuilt\\" } | ForEach-Object { $_.FullName })
          if ($files.Count -ne 5) { "expected the installer, Pine.exe and three helpers, found: $files"; exit 1 }
          foreach ($f in $files) {
            $v = (Get-Item -LiteralPath $f).VersionInfo
            "$f : $($v.ProductName) $($v.ProductVersion)"
            if ($v.ProductName -ne "Pine" -or $v.ProductVersion -ne "9.8.7") { exit 1 }
          }
