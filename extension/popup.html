<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Pine</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				width: 280px;
				margin: 0;
				padding: 14px 16px;
				font: 13px/1.45 system-ui, sans-serif;
			}
			h1 {
				display: flex;
				align-items: center;
				gap: 8px;
				margin: 0 0 8px;
				font-size: 14px;
			}
			.dot {
				width: 8px;
				height: 8px;
				border-radius: 50%;
				background: #9aa0a6;
			}
			.dot[data-on] {
				background: #1c7c54;
			}
			p {
				margin: 0 0 8px;
			}
			.quiet {
				opacity: 0.7;
			}
			ul {
				margin: 0 0 8px;
				padding: 0;
				list-style: none;
			}
			li {
				display: flex;
				justify-content: space-between;
				gap: 8px;
				padding: 3px 0;
			}
			button {
				font: inherit;
			}
		</style>
	</head>
	<body>
		<h1><span class="dot" id="dot"></span><span id="title">Pine</span></h1>
		<p id="line"></p>
		<ul id="groups"></ul>
		<p class="quiet" id="hint"></p>
		<button id="again" hidden>Try again</button>
		<script src="popup.js"></script>
	</body>
</html>
